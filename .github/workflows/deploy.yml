name: Deploy backend to EC2

on:
  # Paused: automatic deploy on push to master is disabled for now.
  # Re-enable by restoring the push trigger.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            sudo systemctl stop leetcode-app.service
            cd /home/ec2-user/LeetcodeMotivation/backend
            git reset --hard
            git pull
            ./gradlew bootJar --no-daemon
            sudo systemctl daemon-reload
            sudo systemctl start leetcode-app.service
