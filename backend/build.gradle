plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.1'
	id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.grishin'
version = '0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Web + GraphQL (WebFlux used by HttpGraphQlClient for LeetCode API calls)
	implementation 'org.springframework.boot:spring-boot-starter-graphql'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.graphql:spring-graphql-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'jakarta.validation:jakarta.validation-api:3.0.2'

	// AWS Lambda container handler
	implementation 'com.amazonaws.serverless:aws-serverless-java-container-springboot3:2.0.3'

	// PostgreSQL + JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Security
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Selenium only needed for integration tests
	testImplementation 'org.seleniumhq.selenium:selenium-java:4.35.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Lambda deployment ZIP: classes + resources at root, dependencies in lib/
task buildZip(type: Zip) {
	archiveFileName = 'app-lambda.zip'
	destinationDirectory = layout.buildDirectory.dir('distributions')
	from compileJava
	from processResources
	into('lib') {
		from configurations.runtimeClasspath
	}
}

build.dependsOn buildZip
