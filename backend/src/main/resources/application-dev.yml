# Development profile — connects to a local PostgreSQL instance

app:
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000
  base-url: http://localhost:6084/api

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leetcode_motivation}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: DEBUG
    com.grishin: DEBUG
    org.hibernate.SQL: INFO

server:
  port: 6084
  error:
    include-stacktrace: always
    include-binding-errors: always
  servlet:
    session:
      timeout: 24h
