# Production profile — Lambda + Google Cloud SQL PostgreSQL
# DB_URL, DB_USERNAME, DB_PASSWORD must be set as Lambda environment variables.

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://leetcode-motivation.vercel.app}
  base-url: https://api.leetstreak.pro/api

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Keep pool small — Lambda has limited memory and connections are expensive across cold starts
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    com.grishin: INFO

server:
  error:
    include-stacktrace: never
