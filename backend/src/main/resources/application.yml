spring:
  application:
    name: LeetcodeMotivation
  mvc:
    log-request-details: true
  main:
    # Servlet mode: prevents webflux from starting a Netty server.
    # WebFlux is still used by HttpGraphQlClient for outbound LeetCode API calls.
    web-application-type: servlet
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  servlet:
    contextPath: /api
  error:
    include-message: always

payment:
  point:
    value: 10

costs:
  easy-cost: 100
  medium-cost: 300
  hard-cost: 700

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

rewards:
  items:
    - id: coffee-no-sugar
      title: No Sugar Coffee
      description: Basic black coffee or americano without sugar
      pointCost: 100
      image: /images/regular-coffee.jpg
      category: coffee

    - id: starbucks-latte
      title: Starbucks Latte
      description: Classic Starbucks latte of your choice
      pointCost: 300
      image: /images/paper-cup-starb.png
      category: coffee

    - id: monster-energy-no-sugar
      title: Monster Energy Drink (No Sugar)
      description: Sugar-free Monster energy drink
      pointCost: 400
      image: /images/monster-no-sugar.png
      category: energy

    - id: starbucks-frappe
      title: Starbucks Frappe
      description: Refreshing Starbucks frappe or frappuccino
      pointCost: 600
      image: /images/starbucks-frappe.jpg
      category: coffee

    - id: game-wallet-10
      title: Game Wallet $10
      description: $10 credit for Steam, PlayStation, or Xbox
      pointCost: 1500
      image: /images/game-wallet.jpg
      category: gaming

    - id: hall-pass
      title: Hall Pass
      description: Allow yourself to break one of the self-imposed rules for a day
      pointCost: 1200
      image: /images/freedom_eagle.png
      category: gaming
